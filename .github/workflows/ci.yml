name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, format, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          uv sync --frozen
          bun install --frozen-lockfile

      - name: Ruff lint
        run: uv run ruff check backend tests

      - name: Ruff format
        run: uv run ruff format --check backend tests

      - name: Prettier
        run: bun run format:check

      - name: ShellCheck
        run: shellcheck -S warning start.sh run-service.sh service.sh

      - name: Tests
        run: uv run pytest
