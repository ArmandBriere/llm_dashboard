[project]
name = "llm-dashboard"
version = "1.0.0"
description = "Local dashboard that tracks Claude Code quota and usage across several subscriptions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.16.0",
    "watchfiles>=0.24.0",
]

# The backend is run from source (uvicorn backend.main:app); nothing is built
# or installed as a package.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# `backend` is imported from the repo root; this makes the bare `pytest`
# entrypoint behave like `python -m pytest`.
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    # Starlette's TestClient warns about the httpx transport it ships with.
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "PIE",  # misc lints
    "PERF", # performance
    "RUF",  # ruff-specific
    "N",    # naming
]
ignore = [
    # Explicit `dict()`/`list()` over literals is a style choice we do not enforce.
    "C408",
    # The codebase catches broad exceptions around subprocess and network
    # calls on purpose: a poll must never take the collector down.
    "B904",
]

[tool.ruff.lint.per-file-ignores]
# Tests build fixtures with many positional arguments and long literal lines.
"tests/*" = ["E501"]

[tool.ruff.format]
quote-style = "double"
